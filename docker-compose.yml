services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${WEB_CONCURRENCY:-3}
      --timeout ${WEB_TIMEOUT:-60}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      DATABASE_URL: ""
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_NAME: ${POSTGRES_DB:-financeflow}
      DB_USER: ${POSTGRES_USER:-financeflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-financeflow123}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financeflow}:${RABBITMQ_PASSWORD:-financeflow123}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/auth/login/'); r=c.getresponse(); raise SystemExit(0 if r.status < 500 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeflow}
      POSTGRES_USER: ${POSTGRES_USER:-financeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeflow123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build: ./deploy/pgbouncer
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-financeflow}
      POSTGRES_USER: ${POSTGRES_USER:-financeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeflow123}
      PGBOUNCER_USER: ${POSTGRES_USER:-financeflow}
      PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD:-financeflow123}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $$PGBOUNCER_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financeflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-financeflow123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-critical:
    build: .
    restart: unless-stopped
    command: celery -A config worker -Q critical -l info
    env_file: .env
    environment: &django_worker_env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      DATABASE_URL: ""
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_NAME: ${POSTGRES_DB:-financeflow}
      DB_USER: ${POSTGRES_USER:-financeflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-financeflow123}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financeflow}:${RABBITMQ_PASSWORD:-financeflow123}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_files:/app/media
    depends_on: &worker_depends_on
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-default:
    build: .
    restart: unless-stopped
    command: celery -A config worker -Q default -l info
    env_file: .env
    environment: *django_worker_env
    volumes:
      - media_files:/app/media
    depends_on: *worker_depends_on

  worker-reports:
    build: .
    restart: unless-stopped
    command: celery -A config worker -Q reports -l info
    env_file: .env
    environment: *django_worker_env
    volumes:
      - media_files:/app/media
    depends_on: *worker_depends_on

  worker-market-data:
    build: .
    restart: unless-stopped
    command: celery -A config worker -Q market_data -l info
    env_file: .env
    environment: *django_worker_env
    volumes:
      - media_files:/app/media
    depends_on: *worker_depends_on

  worker-notifications:
    build: .
    restart: unless-stopped
    command: celery -A config worker -Q notifications -l info
    env_file: .env
    environment: *django_worker_env
    volumes:
      - media_files:/app/media
    depends_on: *worker_depends_on

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment: *django_worker_env
    volumes:
      - media_files:/app/media
    depends_on: *worker_depends_on

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media_files:
  static_files:
