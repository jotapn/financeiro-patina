{% load humanize %}
<a href="{% url 'account_detail' account.pk %}" class="glass rounded-xl p-4 block hover:bg-white/10 transition-all">
  <div class="flex justify-between items-start">
    <div>
      <p class="font-medium">{{ account.name }}</p>
      <p class="text-xs text-slate-400">{{ account.get_account_type_display }} · {{ account.bank_display }}</p>
    </div>
    <div class="flex gap-2">
      <a href="{% url 'account_edit' account.pk %}" class="text-xs text-blue-300">Editar</a>
      <form method="post" action="{% url 'account_delete' account.pk %}">{% csrf_token %}<button type="submit" class="text-xs text-red-300">Excluir</button></form>
    </div>
  </div>
  <p class="mt-3 text-lg font-semibold {% if account.current_balance >= 0 %}text-green-400{% else %}text-red-400{% endif %}">
    R$ {{ account.current_balance|floatformat:2|intcomma }}
  </p>
</a>
