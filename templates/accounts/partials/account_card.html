{% load humanize %}
<article class="glass glass-hover rounded-[1.35rem] p-4 flex flex-col gap-4">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <a href="{% url 'account_detail' account.pk %}" class="block">
        <p class="text-lg font-semibold text-white truncate">{{ account.name }}</p>
        <p class="text-sm mt-1" style="color:rgba(245,247,251,0.5)">
          {{ account.get_account_type_display }} &middot; {{ account.bank_display }}
        </p>
      </a>
    </div>

    <span
      class="w-4 h-4 rounded-full border border-white/10 shrink-0"
      style="background: {{ account.color|default:'#4da3ff' }}"
      aria-hidden="true"
    ></span>
  </div>

  <div class="flex items-end justify-between gap-4">
    <div>
      <p class="text-[11px] uppercase tracking-[0.18em]" style="color:rgba(245,247,251,0.36)">Saldo atual</p>
      <p class="mt-2 text-2xl font-bold {% if account.current_balance >= 0 %}text-green-400{% else %}text-red-400{% endif %}">
        R$ {{ account.current_balance|floatformat:2|intcomma }}
      </p>
    </div>

    <div class="flex items-center gap-3 shrink-0">
      <a href="{% url 'account_detail' account.pk %}" class="text-xs font-semibold uppercase tracking-[0.08em]" style="color:rgba(245,247,251,0.56)">
        Ver conta
      </a>
      <a href="{% url 'account_edit' account.pk %}" class="text-xs font-semibold uppercase tracking-[0.08em] text-blue-300">
        Editar
      </a>
      <form method="post" action="{% url 'account_delete' account.pk %}" onsubmit="return confirm('Deseja excluir esta conta?');">
        {% csrf_token %}
        <button type="submit" class="text-xs font-semibold uppercase tracking-[0.08em] text-red-300">
          Excluir
        </button>
      </form>
    </div>
  </div>
</article>
