<div class="space-y-2">
  {% for session in sessions %}
  <a href="{% url 'ai_session_detail' session.pk %}" class="block rounded-2xl px-3 py-3 transition-all {% if current_session and current_session.pk == session.pk %}glass border border-purple-500/40{% else %}hover:bg-white/5{% endif %}">
    <p class="text-sm font-medium text-white truncate">{{ session.title|default:"Nova conversa" }}</p>
    <p class="text-xs text-slate-400">{{ session.created_at|date:"d/m/Y H:i" }}</p>
  </a>
  {% empty %}
  <p class="text-sm text-slate-400">Nenhuma conversa ainda.</p>
  {% endfor %}
</div>
