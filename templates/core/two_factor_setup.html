{% extends 'base.html' %}
{% block title %}Ativar 2FA - FinanceFlow{% endblock %}
{% block page_title %}Autenticacao em duas etapas{% endblock %}
{% block page_subtitle %}Proteja sua conta com um codigo temporario do app autenticador{% endblock %}
{% block content %}
<div class="max-w-3xl">
  <div class="glass rounded-[1.75rem] p-6 md:p-7">
    <div class="grid md:grid-cols-[220px_1fr] gap-6 items-start">
      <div class="rounded-3xl bg-white p-4">
        <img src="{{ qr_code_data_url }}" alt="QR Code 2FA" class="w-full h-auto">
      </div>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label>Codigo do app autenticador</label>
          <input type="text" name="token" class="input-glass mt-2" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
        </div>
        <button type="submit" class="btn-primary">Ativar 2FA</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
