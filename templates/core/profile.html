{% extends 'base.html' %}
{% block title %}Perfil - FinanceFlow{% endblock %}
{% block page_title %}Meu perfil{% endblock %}
{% block content %}
<div class="max-w-3xl glass rounded-2xl p-6">
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-xs mb-2 text-slate-300">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-red-400 text-xs mt-1">{{ field.errors|join:', ' }}</p>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn-primary">Salvar perfil</button>
  </form>
</div>
{% endblock %}
