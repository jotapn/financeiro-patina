[databases]
${POSTGRES_DB} = host=${POSTGRES_HOST} port=${POSTGRES_PORT} dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /run/pgbouncer/userlist.txt
admin_users = ${PGBOUNCER_USER}
stats_users = ${PGBOUNCER_USER}
pool_mode = transaction
max_client_conn = ${PGBOUNCER_MAX_CLIENT_CONN}
default_pool_size = ${PGBOUNCER_DEFAULT_POOL_SIZE}
reserve_pool_size = ${PGBOUNCER_RESERVE_POOL_SIZE}
ignore_startup_parameters = extra_float_digits
pidfile = /run/pgbouncer/pgbouncer.pid
